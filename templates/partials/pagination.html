{% load store %}
{% if is_paginated %}
  <nav class="pagination" aria-label="صفحه‌بندی">
    {% if page_obj.has_previous %}
      <a class="btn btn-ghost btn-sm" href="?{{ filters_query }}{% if filters_query %}&{% endif %}page={{ page_obj.previous_page_number }}">قبلی</a>
    {% endif %}
    <span class="muted">صفحه {{ page_obj.number|fa_num }} از {{ page_obj.paginator.num_pages|fa_num }}</span>
    {% if page_obj.has_next %}
      <a class="btn btn-ghost btn-sm" href="?{{ filters_query }}{% if filters_query %}&{% endif %}page={{ page_obj.next_page_number }}">بعدی</a>
    {% endif %}
  </nav>
{% endif %}
