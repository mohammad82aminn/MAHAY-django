<svg viewBox="0 0 140 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="سفارش پروژه">
  <title>سفارش پروژه</title>
  <!-- Nothing is filled with a flat background colour: the card shows through instead, so the
       one file reads on the light surface and on the dark one. -->
  <ellipse cx="70" cy="60" rx="66" ry="56" fill="#3b82f6" opacity=".10"/>

  <!-- a chip, because the work handed over here is engineering -->
  <g stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round">
    <path d="M104 30v-8M116 30v-8M104 74v8M116 74v8"/>
    <path d="M96 40h-8M96 52h-8M96 64h-8"/>
    <path d="M132 40h8M132 52h8M132 64h8"/>
  </g>
  <rect x="96" y="30" width="36" height="44" rx="6" fill="none" stroke="#3b82f6" stroke-width="4"/>
  <rect x="106" y="44" width="16" height="16" rx="3" fill="#3b82f6"/>

  <!-- the brief -->
  <rect x="14" y="18" width="58" height="76" rx="9" fill="none" stroke="#3b82f6" stroke-width="4.5"/>
  <rect x="31" y="10" width="24" height="16" rx="5" fill="#3b82f6"/>
  <path d="M27 44h32M27 57h32M27 70h19" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>

  <!-- accepted -->
  <circle cx="72" cy="92" r="17" fill="#f97316"/>
  <path d="m65 92 5 5 10-11" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
