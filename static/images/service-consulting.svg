<svg viewBox="0 0 140 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="مشاوره تخصصی">
  <title>مشاوره تخصصی</title>
  <!-- Two voices: the question you bring, and the answer that comes back from someone who
       knows the field. Nothing is filled with a flat background colour, so it reads on the
       light surface and on the dark one alike. -->
  <ellipse cx="70" cy="60" rx="66" ry="56" fill="#3b82f6" opacity=".10"/>

  <!-- the question -->
  <path d="M18 18h72a10 10 0 0 1 10 10v34a10 10 0 0 1-10 10H46L28 88V72h-10a10 10 0 0 1-10-10V28a10 10 0 0 1 10-10z"
        transform="translate(4 0)" fill="none" stroke="#3b82f6" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M36 38h50M36 51h32" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>

  <!-- the answer, and the idea it leaves behind -->
  <path d="M78 70h40a8 8 0 0 1 8 8v20a8 8 0 0 1-8 8h-6l-11 10V106H78a8 8 0 0 1-8-8V78a8 8 0 0 1 8-8z"
        fill="#f97316"/>
  <circle cx="86" cy="88" r="3.6" fill="#fff"/>
  <circle cx="98" cy="88" r="3.6" fill="#fff"/>
  <circle cx="110" cy="88" r="3.6" fill="#fff"/>
</svg>
